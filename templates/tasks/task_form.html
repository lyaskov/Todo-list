{% extends 'base.html' %}

{% block content %}
  {% if object %}
    <h1>Update task</h1>
  {% else %}
    <h1>Create task</h1>
  {% endif %}
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    {% if object %}
      <button type="submit">Update</button>
    {% else %}
      <button type="submit">Create</button>
    {% endif %}
  </form>
{% endblock %}
